<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NFL Ergebnisse · Woche 5 · 8.–12. Okt 2026</title>
<style>
:root{--bg:#07090f;--panel:#0f1420;--panel2:#141b2b;--line:#222b3f;--txt:#e9edf5;--mut:#8f9ab0;--acc:#d50a0a;--gold:#ffc62f;--free:#18c964;--warn:#ffb020}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:"Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(1200px 500px at 15% -10%,rgba(213,10,10,.22),transparent 60%),radial-gradient(1000px 500px at 100% 0,rgba(1,51,105,.35),transparent 60%),var(--bg)}
a{color:#9cc3ff}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}
header.hero{padding:34px 0 18px;border-bottom:1px solid var(--line);position:relative;overflow:hidden}
header.hero:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.025) 0 2px,transparent 2px 22px);pointer-events:none}
.brand{display:flex;align-items:center;gap:18px;position:relative}
.brand img{height:74px;filter:drop-shadow(0 6px 18px rgba(0,0,0,.6))}
.kicker{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);font-weight:800}
h1{margin:4px 0 2px;font-size:clamp(28px,5vw,48px);line-height:1;font-weight:900;letter-spacing:-.02em;text-transform:uppercase;font-style:italic}
h1 span{color:var(--acc)}
.sub{color:var(--mut);font-size:15px}
.timenote{margin:16px 0 0;font-size:13px;color:#c5cddd;background:rgba(255,255,255,.04);border:1px solid var(--line);border-left:3px solid var(--gold);padding:10px 12px;border-radius:8px;position:relative}
nav.tabs{position:sticky;top:0;z-index:20;background:rgba(7,9,15,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.tabrow{display:flex;gap:8px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
.tab{flex:0 0 auto;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);color:var(--txt);padding:8px 14px;border-radius:999px;font-weight:700;font-size:14px;cursor:pointer;transition:.15s}
.tab>svg{width:22px;height:15px;border-radius:2px;box-shadow:0 0 0 1px rgba(255,255,255,.15)}
.tab:hover{border-color:#3a4766}
.tab.on{background:linear-gradient(135deg,#d50a0a,#8a0610);border-color:#ff4d4d;box-shadow:0 4px 18px rgba(213,10,10,.35)}
section.slot{margin:30px 0}
.slothead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid var(--line);position:relative}
.slothead:after{content:"";position:absolute;left:0;bottom:-2px;width:90px;height:2px;background:var(--acc)}
.slothead .t{font-size:34px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.slothead .t small{font-size:14px;color:var(--mut);font-weight:700;margin-left:4px}
.slothead .l{font-size:16px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.slothead .d{color:var(--gold);font-weight:800;font-size:14px}
.slothead .et{color:var(--mut);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(520px,1fr));gap:16px}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.match{position:relative;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:16px 14px;background:linear-gradient(100deg,var(--a1) 0%,var(--a1) 38%,#0c0f18 50%,var(--h1) 62%,var(--h1) 100%);min-height:108px}
.match:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.45))}
.match:after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,var(--a2) 0 50%,var(--h2) 50% 100%)}
.team{position:relative;display:flex;align-items:center;gap:10px;min-width:0}
.team.h{flex-direction:row-reverse;text-align:right}
/* Teamlogos auf hellem Rund-Badge: sonst verschwinden z.B. Jets (grün auf grün), Rams, Giants auf Teamfarbe/dunklem Grund */
.team img{width:62px;height:62px;object-fit:contain;background:#f4f6fa;border-radius:50%;padding:8px;box-sizing:border-box;box-shadow:0 3px 10px rgba(0,0,0,.45),inset 0 0 0 2px rgba(255,255,255,.6);flex:0 0 auto}
.team .nm{font-weight:900;font-size:19px;text-transform:uppercase;letter-spacing:.01em;text-shadow:0 2px 6px rgba(0,0,0,.6);line-height:1.05}
.team .ct{font-size:12px;opacity:.85;font-weight:600}
.team .rec{font-size:12px;font-weight:800;background:rgba(0,0,0,.4);padding:1px 7px;border-radius:6px;display:inline-block;margin-top:3px}
.mid{position:relative;text-align:center;padding:0 8px}
.mid .at{font-weight:900;font-size:15px;color:#fff;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.2);width:34px;height:34px;line-height:32px;border-radius:50%;margin:0 auto}
.mid .score{font-size:30px;font-weight:900;font-variant-numeric:tabular-nums;text-shadow:0 2px 8px rgba(0,0,0,.7);white-space:nowrap}
.mid .fin{font-size:10px;letter-spacing:.2em;font-weight:900;background:#fff;color:#000;border-radius:4px;padding:2px 6px;display:inline-block;margin-top:2px}
.venue{font-size:12px;color:var(--mut);padding:8px 14px 0}
.rows{padding:6px 10px 12px}
.row{display:flex;gap:10px;align-items:flex-start;padding:9px 6px;border-top:1px solid rgba(255,255,255,.06)}
.row:first-child{border-top:0}
.flag{display:block;flex:0 0 auto;width:24px;height:16px;margin-top:9px;border-radius:2px;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.18)}
.flag svg{display:block;width:24px;height:16px}
.rbody{flex:1;min-width:0}
.chans{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
/* Sender-Chips: alle exakt 34px hoch, ohne Rahmen (kein Doppelrand). Logo-Höhe --h kommt pro Logo aus LOGO_CFG,
   der Innenabstand ist auf allen vier Seiten gleich: (34px - --h) / 2. Logos sind auf ihren sichtbaren Inhalt beschnitten (trim_logos.py). */
.logo{--h:18px;--pad:calc((34px - var(--h)) / 2);--cw:104px;height:34px;min-width:var(--cw);padding:0 var(--pad);flex:none;overflow:hidden;background:#fff;border:0;border-radius:7px;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.logo img{height:var(--h);width:auto;max-width:none;object-fit:contain;display:block;margin:0}
.logo.dark{background:#000;box-shadow:0 0 0 1px rgba(255,255,255,.22),0 1px 3px rgba(0,0,0,.35)}
.flag.ico{box-shadow:none;border-radius:3px}
.flag.ico svg,.tab>svg.ico{display:block;width:24px;height:16px}
.where{font-size:11px;color:#9aa6bf;margin-top:4px;line-height:1.35}
.gi .g span.wh{display:block;font-size:10.5px;color:#9aa6bf;font-weight:500;margin-top:2px}
.glrow{display:flex;align-items:center;gap:8px;margin-top:5px}.glrow .logo{flex:none}.gi .g .glrow>span:not(.logo){display:inline;margin:0;font-size:12px;color:var(--mut);font-weight:600}
.card.daznfree{box-shadow:0 0 0 1px #f6ff00aa,0 10px 30px #0006}
.logo.txtb{--pad:10px;min-width:0;background:linear-gradient(135deg,#2b3550,#1a2033);color:#fff;font-weight:800;font-size:12.5px;box-shadow:0 0 0 1px #3a4766;white-space:nowrap}
.ctext{font-size:14px;font-weight:600}
.com{font-size:12.5px;color:var(--mut);margin-top:2px}
.badge{font-size:10.5px;font-weight:900;letter-spacing:.1em;padding:3px 7px;border-radius:5px;text-transform:uppercase;white-space:nowrap}
.free{background:var(--free);color:#02240f;box-shadow:0 0 12px rgba(24,201,100,.4)}
.unc{background:transparent;color:var(--warn);border:1px solid var(--warn)}
.src{background:rgba(156,195,255,.12);color:#9cc3ff;border:1px solid rgba(156,195,255,.3)}
.paid{background:rgba(255,255,255,.08);color:#c5cddd;border:1px solid #3a4766}
.share{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12px;color:var(--mut)}
.bar{flex:1;max-width:220px;height:7px;background:#1d2536;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px;margin-right:4px}
details.reg{margin-top:8px;background:var(--panel2);border:1px solid var(--line);border-radius:10px}
details.reg summary{cursor:pointer;padding:8px 10px;font-size:13px;font-weight:800;color:#c5d6ff;list-style:none;display:flex;justify-content:space-between}
details.reg summary::-webkit-details-marker{display:none}
details.reg summary:after{content:"▾";transition:.2s}
details.reg[open] summary:after{transform:rotate(180deg)}
.regbody{padding:0 12px 12px;font-size:13px}
.regbody .rg{color:#c5cddd;margin-bottom:8px}
.mk{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:4px 12px}
.mk div{font-size:12.5px;color:#d6dcea;padding:3px 0;border-bottom:1px dashed rgba(255,255,255,.07)}
.mk b{color:#fff;font-variant-numeric:tabular-nums}
.regbody .nt{margin-top:8px;font-size:12px;color:var(--mut)}
.fallback{font-size:13px;color:var(--mut)}
.info{margin:26px 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.ibox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.ibox h3{margin:0 0 8px;font-size:15px;text-transform:uppercase;letter-spacing:.08em;display:flex;align-items:center;gap:10px}
.ibox .row{padding:8px 0}
.glance{margin:22px 0 6px}
.glance h2,.info h2{font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin:0 0 10px}
.gl{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.gi{display:flex;gap:10px;align-items:center;background:linear-gradient(135deg,rgba(24,201,100,.10),rgba(24,201,100,.02));border:1px solid rgba(24,201,100,.3);border-radius:12px;padding:10px 12px}
.gi .tm{font-weight:900;font-size:18px;font-variant-numeric:tabular-nums;min-width:52px}
.gi .tm small{display:block;font-size:10px;color:var(--mut);font-weight:700}
.gi .g{font-size:13.5px;font-weight:700;flex:1;min-width:0}
.gi .g b{white-space:nowrap}
.gi .g>span{display:block;font-size:12px;color:var(--mut);font-weight:600}
.byes{color:var(--mut);font-size:13px;margin:10px 0}
.byes img{height:26px;width:26px;object-fit:contain;background:#f4f6fa;border-radius:50%;padding:3px;box-sizing:border-box;vertical-align:middle;margin:0 4px 0 2px}
footer{border-top:1px solid var(--line);margin-top:40px;padding:22px 0 40px;color:var(--mut);font-size:12.5px}
footer ol{padding-left:18px;margin:8px 0}
footer li{margin:3px 0;overflow-wrap:anywhere}
.stand{margin-top:12px;color:#c5cddd;font-weight:700}
.hide{display:none!important}
/* Ergebnisse / Live / Highlights */
.navrow{display:flex;align-items:center;gap:10px}
.navrow .tabrow{flex:1;min-width:0}
.restog{flex:0 0 auto;display:inline-flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line);color:var(--txt);padding:6px 8px 6px 12px;border-radius:999px;font:inherit;font-weight:700;font-size:13.5px;cursor:pointer;transition:.15s;white-space:nowrap}
.restog:hover{border-color:#3a4766}
.restog .ey{width:18px;height:18px;display:block;color:var(--gold)}
.restog .sw{position:relative;width:38px;height:22px;border-radius:999px;background:#2a3348;transition:.2s;flex:none}
.restog .sw:after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#8f9ab0;transition:.2s}
.restog[aria-pressed="true"] .sw{background:var(--free)}
.restog[aria-pressed="true"] .sw:after{left:19px;background:#fff}
.restog .st{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);min-width:24px}
.restog[aria-pressed="true"] .st{color:#8ff0b8}
.livestat{font-size:11.5px;color:var(--mut);padding:0 0 8px;margin-top:-4px;text-align:right}
.livestat.err{color:var(--warn)}
.mid .fin.ot{background:var(--gold)}
.mid .fin.done{background:rgba(0,0,0,.55);color:#e9edf5;border:1px solid rgba(255,255,255,.3)}
.mid .score .w{color:#fff}.mid .score .l{color:rgba(255,255,255,.62)}.mid .score .c{margin:0 .12em;color:rgba(255,255,255,.75)}
.mid .lv{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;letter-spacing:.12em;font-weight:900;background:#d50a0a;color:#fff;border-radius:4px;padding:2px 7px;margin-top:3px;white-space:nowrap;box-shadow:0 0 12px rgba(213,10,10,.55)}
.mid .lv:before{content:"";width:6px;height:6px;border-radius:50%;background:#fff;animation:pulse 1.2s infinite}
.mid .at+.lv,.mid .at+.fin{margin-top:5px}
@keyframes pulse{50%{opacity:.25}}
.venue{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.venue .vn{min-width:0}
.hlbtn{display:inline-flex;align-items:center;gap:8px;flex:none;text-decoration:none;color:#fff;font-weight:800;font-size:13px;background:linear-gradient(135deg,#1e1e24,#111116);border:1px solid #3a3a46;border-radius:9px;padding:5px 12px 5px 8px;box-shadow:0 2px 8px rgba(0,0,0,.4);transition:.15s}
.hlbtn:hover{border-color:#ff3b3b;background:linear-gradient(135deg,#2a1214,#16090a);box-shadow:0 2px 14px rgba(255,0,0,.25)}
.hlbtn svg{width:26px;height:18px;display:block}
.hlbtn small{font-weight:600;color:#aab3c5;font-size:11px}
/* Wochen-Navigation */
.weeks{display:flex;align-items:center;gap:6px;margin-top:14px;overflow-x:auto;scrollbar-width:none;position:relative;padding:2px 0}
.weeks::-webkit-scrollbar{display:none}
.weeks .wl{flex:none;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);font-weight:800;margin-right:4px}
.wk{flex:none;min-width:34px;height:30px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 11px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--txt);text-decoration:none;font-weight:800;font-size:13px;font-variant-numeric:tabular-nums;transition:.15s}
a.wk:hover{border-color:#3a4766;background:var(--panel2)}
.wk.cur{background:linear-gradient(135deg,#d50a0a,#8a0610);border-color:#ff4d4d;color:#fff;box-shadow:0 3px 12px rgba(213,10,10,.35)}
.wk .pl{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:900}
.wk.cur .pl{color:#ffe08a}
.wk.now{color:var(--gold);border-color:rgba(255,198,47,.45);margin-left:6px}
/* Beendete Spiele: kompakte Ergebnis-Karte ohne Senderinfos */
.grid{align-items:start}
.card.done .rows{display:none}
.card.done .match{min-height:80px;padding:11px 12px}
.card.done .team img{width:48px;height:48px;padding:6px}
.card.done .match{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr)}.team>div{min-width:0}.card.done .team .nm,.card.done .team .ct{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card.done .team .nm{font-size:15.5px}.card.done .mid{padding:0 10px}
.card.done .mid .score{font-size:28px}
.card.done .venue{padding:9px 14px 11px}
.grid.alldone{grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:12px}
.donenote{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:18px 0 0;font-size:13px;color:#c5cddd;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.donenote button{font:inherit;font-weight:800;font-size:12.5px;color:#fff;background:var(--panel2);border:1px solid #3a4766;border-radius:999px;padding:4px 12px;cursor:pointer}
.donenote button:hover{border-color:#ff4d4d}
body.results .tabrow{display:none}
body.results .navrow{justify-content:flex-end}
body.results .navrow:before{content:"Ergebnisse & Highlights";margin-right:auto;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:800;padding:14px 0}
body.results section.slot{margin:24px 0}
@media(max-width:600px){.weeks .wl{display:none}.wk{height:28px;min-width:30px;padding:0 9px;font-size:12.5px}.grid.alldone{grid-template-columns:1fr}.card.done .match{min-height:70px;padding:10px 8px}.card.done .team img{width:38px;height:38px;padding:5px}.card.done .team .nm{font-size:13px}.card.done .mid .score{font-size:21px}body.results .navrow:before{font-size:10.5px;letter-spacing:.14em}}
@media(max-width:600px){.restog .ey,.restog .st{display:none}.restog{padding:6px 6px 6px 11px;gap:7px;font-size:12.5px}.restog .sw{width:34px;height:20px}.restog .sw:after{width:14px;height:14px}.restog[aria-pressed="true"] .sw:after{left:17px}.livestat{text-align:left}.hlbtn{padding:4px 10px 4px 7px;font-size:12.5px}}
@media(max-width:600px){
 .team img{width:44px;height:44px;padding:6px}.team .nm{font-size:15px}.slothead .t{font-size:28px}
 .match{padding:12px 8px;min-height:90px}.brand img{height:54px}.mid .score{font-size:24px}
 .team .ct{display:none}
 .team .nm{font-size:13px}.team{gap:6px}.team img{width:38px;height:38px;padding:5px}.mid{padding:0 4px}.mid .score{font-size:20px}.mid .at{width:28px;height:28px;line-height:26px;font-size:13px}
 .match{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr)}
}
</style>
</head>
<body>
<header class="hero"><div class="wrap">
 <div class="brand"><img id="nfllogo" alt="NFL"><div>
  <div class="kicker" id="kicker"></div>
  <h1>NFL <span>TV-Plan</span></h1>
  <div class="sub" id="sub"></div></div></div>
 <nav class="weeks" id="weeks" aria-label="Spielwochen"></nav>
 <div class="timenote" id="timenote"></div>
</div></header>
<nav class="tabs"><div class="wrap"><div class="navrow"><div class="tabrow" id="tabs"></div><button type="button" class="restog" id="restog" aria-pressed="true" title="Ergebnisse ein-/ausblenden (Spoiler-Schutz)"><svg class="ey" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg><span class="tx">Ergebnisse</span><span class="sw"></span><span class="st">an</span></button></div><div class="livestat" id="livestat"></div></div></nav>
<main class="wrap">
 <div class="donenote hide" id="donenote"></div>
 <div class="glance" id="glance"></div>
 <div id="slots"></div>
 <div class="info" id="info"></div>
 <div class="byes" id="byes"></div>
</main>

 const c=LOGO_CFG[k]||{};return `<span class="logo${c.chip==="dark"?" dark":""}" data-k="${k}" title="${esc(NETNAME[k]||k)}" style="--h:${logoH(k)}px"><img src="${LOGOS[k]}" alt="${esc(NETNAME[k]||k)}"></span>`;

function badges(e){let b="";if(e.free)b+=` <span class="badge free">Gratis</span>`;if(e.paid)b+=` <span class="badge paid">Pay</span>`;if(e.src)b+=` <span class="badge src">${esc(e.src)}</span>`;return b}
function entryRow(c,e){return `<div class="row" data-c="${c}">${flag(c)}<div class="rbody"><div class="chans">${logo(e.ch)}<span class="ctext">${esc(e.txt)}</span>${badges(e)}</div>${e.com?`<div class="com">${esc(e.com)}</div>`:""}${e.where?`<div class="where">ⓘ ${esc(e.where)}</div>`:""}</div></div>`}
const T=DATA.teams;
function teamBlock(ab,rec,side){const t=T[ab];const city=t.name.replace(" "+t.short,"");return `<div class="team ${side}"><img src="${LOGOS["team_"+ab]}" alt="${esc(t.name)}"><div><div class="ct">${esc(city)}</div><div class="nm">${esc(t.short)}</div><span class="rec" data-rec="1">${esc(rec)}</span></div></div>`}
function usRow(g){const u=g.us;let ch="",extra="";
 if(u.national){ch=u.national.map(logo).join("");if(u.also&&u.also.length){ch+=u.also.map(a=>logo(a.ch)).join("");ch+=`<span class="badge src">${u.also.map(a=>esc(a.txt)).join(" & ")} ${esc(u.also[0].src)}</span>`;}
  extra=`<div class="com">🎙 ${esc(u.crew)}${u.extra?" · "+esc(u.extra):""}</div>`;
  if(u.locals) extra+=`<div class="com">Lokale Simulcasts: ${u.locals.map(esc).join(", ")} <span class="badge src">laut ${esc(u.locals_src)}</span></div>`;
  return `<div class="row" data-c="us">${flag("us")}<div class="rbody"><div class="chans">${ch}<span class="ctext">landesweit</span></div>${extra}</div></div>`}
 ch=logo(u.net)+`<span class="ctext">regional</span>`;
 extra=`<div class="com">🎙 ${esc(u.crew)}</div><div class="share"><span class="dot" style="background:${u.color}"></span>ca. ${u.share}% der US-TV-Haushalte<div class="bar"><i style="width:${u.share}%;background:${u.color}"></i></div><span class="badge src">Schätzung</span></div>`;
 const mk=u.markets.map(m=>{const [a,b]=m.split(" – ");return `<div>${esc(a)} <b>${esc(b||"")}</b></div>`}).join("");
 extra+=`<details class="reg"><summary>Regionale Verteilung &amp; Lokalsender (${u.markets.length})</summary><div class="regbody"><div class="rg"><span class="dot" style="background:${u.color}"></span>${esc(u.region)}</div><div class="mk">${mk}</div><div class="nt">${u.note?esc(u.note)+" ":""}Kartenfarbe laut 506sports-Karte (${u.net.toUpperCase()}). Zuteilung inoffiziell, kurzfristige Änderungen möglich. Außerhalb dieser Märkte: NFL Sunday Ticket.</div></div></details>`;
 return `<div class="row" data-c="us">${flag("us")}<div class="rbody"><div class="chans">${ch}</div>${extra}</div></div>`}
const FALLBACK={uk:"Nicht im britischen Free-TV"};
const gameId=g=>(g.away+"-"+g.home).toLowerCase();
// Zusammengeführter Stand eines Spiels: Live-API, sonst eingebautes final/highlight aus dem JSON
function gstate(g){const L=LIVE[gameId(g)];
 const bh=g.highlight?(typeof g.highlight==="string"?{url:g.highlight}:g.highlight):null;
 if(L){const s={state:L.state,as:L.away_score,hs:L.home_score,ot:!!L.ot,period:L.period,clock:L.clock,status:L.status,hl:L.highlight||bh};
  if(s.state==="pre"&&g.final)s.state="post",s.as=g.final.away,s.hs=g.final.home,s.ot=!!g.final.ot;return s}
 if(g.final)return {state:"post",as:g.final.away,hs:g.final.home,ot:!!g.final.ot,hl:bh};
 return {state:"pre",hl:bh};}
const QN=p=>p>4?(p===5?"OT":"OT"+(p-4)):"Q"+p;
function liveText(s){if(s.status==="STATUS_HALFTIME")return "Halbzeit";if(s.status==="STATUS_END_PERIOD")return "Ende "+QN(s.period);
 if(!s.period)return "läuft";return QN(s.period)+(s.clock?" · "+s.clock:"");}
function scoreHTML(s){const a=+s.as,h=+s.hs,cw=x=>s.state==="post"&&a!==h?(x?"w":"l"):"w";
 return `<div class="score"><span class="${cw(a>h)}">${a}</span><span class="c">:</span><span class="${cw(h>a)}">${h}</span></div>`}
function midHTML(g){const s=gstate(g);
 if(s.state==="post"){if(!SHOW_RES)return `<div class="at">@</div><span class="fin done">BEENDET</span>`;
  return scoreHTML(s)+`<span class="fin${s.ot?" ot":""}">${s.ot?"FINAL · n.V.":"FINAL"}</span>`}
 if(s.state==="in"){const lt=esc(liveText(s));if(!SHOW_RES)return `<div class="at">@</div><span class="lv">LIVE · ${lt}</span>`;
  return scoreHTML(s)+`<span class="lv">LIVE · ${lt}</span>`}
 return `<div class="at">@</div>`}
function venueHTML(g){const s=gstate(g);let h=`<span class="vn">📍 ${esc(g.venue)}${s.state==="post"&&!RESULTS?" · bereits gespielt":""}</span>`;
 if(s.hl&&/^https:\/\/(www\.)?youtube\.com\/watch\?v=[\w-]{6,}$/.test(s.hl.url)){const tt=SHOW_RES&&s.hl.title?s.hl.title:"Offizielle Highlights (NFL auf YouTube)";
  h+=`<a class="hlbtn" href="${esc(s.hl.url)}" target="_blank" rel="noopener" title="${esc(tt)}">${YT_ICON}<span>Highlights</span><small>YouTube</small></a>`}
 return h}
function refreshCards(){DATA.games.forEach(g=>{const id=gameId(g),s=gstate(g);
  const m=document.querySelector(`[data-mid="${id}"]`);if(m)m.innerHTML=midHTML(g);
  const v=document.querySelector(`[data-venue="${id}"]`);if(v)v.innerHTML=venueHTML(g);
  // Bilanzen im JSON können nach dem Spiel schon aktualisiert sein -> bei ausgeblendeten Ergebnissen verbergen
  const c=document.querySelector(`[data-gid="${id}"]`);if(c){c.querySelectorAll("[data-rec]").forEach(r=>r.classList.toggle("hide",!SHOW_RES&&s.state==="post"));
   c.classList.toggle("done",s.state==="post")}});
 // Slots: komplett gespielt -> kompaktes Raster + Badge
 DATA.slots.forEach(sl=>{const gs=DATA.games.filter(g=>g.slot===sl.id),all=gs.length&&gs.every(g=>gstate(g).state==="post");
  const sec=document.querySelector(`[data-slot="${sl.id}"]`);if(!sec)return;sec.querySelector(".grid").classList.toggle("alldone",all);sec.querySelector("[data-played]").classList.toggle("hide",!all||RESULTS)});
 applyFilter();
 const t=document.getElementById("restog");t.setAttribute("aria-pressed",SHOW_RES?"true":"false");t.querySelector(".st").textContent=SHOW_RES?"an":"aus";
 t.title=SHOW_RES?"Ergebnisse ausblenden (Spoiler-Schutz)":"Ergebnisse anzeigen";t.setAttribute("aria-label",t.title);
 const ls=document.getElementById("livestat");
 if(LIVE_OK===true){ls.className="livestat";ls.textContent=`Live-Ergebnisse (ESPN) · aktualisiert ${LIVE_TS}${SHOW_RES?"":" · Ergebnisse ausgeblendet"}`}
 else if(LIVE_OK===false){ls.className="livestat err";ls.textContent="Live-Daten gerade nicht erreichbar – gespeicherter Stand wird gezeigt"}
 else ls.textContent=SHOW_RES?"":"Ergebnisse ausgeblendet";}
function toggleRes(){SHOW_RES=!SHOW_RES;try{localStorage.setItem(RES_KEY,SHOW_RES?"1":"0")}catch(e){}refreshCards()}
let liveTimer=null;
async function loadLive(){clearTimeout(liveTimer);let next=null;
 try{const ac=typeof AbortController!=="undefined"?new AbortController():null;const to=setTimeout(()=>ac&&ac.abort(),10000);
  const r=await fetch(`${LIVE_API}?season=${DATA.season}&week=${DATA.week}`,{signal:ac&&ac.signal,cache:"no-store"});clearTimeout(to);
  if(!r.ok)throw new Error("HTTP "+r.status);const j=await r.json();
  if(!j||+j.season!==+DATA.season||+j.week!==+DATA.week||!Array.isArray(j.games))throw new Error("falsche Antwort");
  j.games.forEach(x=>{if(x&&x.id)LIVE[x.id]=x});LIVE_OK=true;
  const d=new Date(j.updated||Date.now());LIVE_TS=d.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit",timeZone:"Europe/Berlin"})+" MEZ";
  const now=Date.now(),gs=Object.values(LIVE);
  if(gs.some(x=>x.state==="in"||(x.state==="pre"&&Date.parse(x.start)-now<15*60e3&&now-Date.parse(x.start)<8*3600e3)))next=60e3;
  else{const up=gs.filter(x=>x.state==="pre"&&Date.parse(x.start)-now<12*3600e3).map(x=>Date.parse(x.start)-now-10*60e3);
   if(up.length)next=Math.max(60e3,Math.min(5*60e3,...up));
   else if(gs.some(x=>x.state==="post"&&!x.highlight&&now-Date.parse(x.start)<36*3600e3))next=5*60e3;}
 }catch(e){LIVE_OK=false;next=2*60e3}
 refreshCards();if(next)liveTimer=setTimeout(loadLive,next);}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&LIVE_OK!==null)loadLive()});
function card(g){const a=T[g.away],h=T[g.home];
 let rows=RESULTS?"":usRow(g);
 if(!RESULTS)CC.forEach(c=>{(g[c]||[]).forEach(e=>rows+=entryRow(c,e));
   if(!(g[c]||[]).length && !g.final && FALLBACK[c]) rows+=`<div class="row fb" data-c="${c}" data-fb="1">${flag(c)}<div class="rbody fallback">${FALLBACK[c]}</div></div>`;});
 const gid=gameId(g);
 const cs=["us"].concat(CC.filter(c=>(g[c]||[]).length));
 return `<article class="card${(g.dazn||[]).length?" daznfree":""}" data-gid="${gid}" data-has="${cs.join(" ")}" style="--a1:${a.c1};--a2:${a.c2};--h1:${h.c1};--h2:${h.c2}"><div class="match">${teamBlock(g.away,g.rec_away,"a")}<div class="mid" data-mid="${gid}">${midHTML(g)}</div>${teamBlock(g.home,g.rec_home,"h")}</div><div class="venue" data-venue="${gid}">${venueHTML(g)}</div>${rows?`<div class="rows">${rows}</div>`:""}</article>`}
function render(){
 document.getElementById("nfllogo").src=LOGOS.nfl;
 document.body.classList.toggle("results",RESULTS);
 document.getElementById("kicker").textContent=`Saison ${DATA.season} · Woche ${DATA.week}${RESULTS?" · Rückblick":""}`;
 document.getElementById("sub").textContent=DATA.date_range+(RESULTS?" · alle Ergebnisse und offiziellen Highlights":" · USA · UK (Free-TV) · Deutschland · DAZN-Gratisspiel der Woche");
 // Wochen-Navigation: nur vorhandene Wochen (DATA.weeks, von build.py aus data/ ermittelt), Links auf das GitHub-Archiv
 const wks=(DATA.weeks||[DATA.week]).slice().sort((a,b)=>a-b),last=wks[wks.length-1],pad=n=>String(n).padStart(2,"0");
 document.getElementById("weeks").innerHTML=`<span class="wl">Woche</span>`+wks.map(w=>{const pl=w===last&&!RESULTS?`<span class="pl">Plan</span>`:"",t=w===last?`Woche ${w} · TV-Plan`:`Woche ${w} · Ergebnisse`;
  return w===DATA.week?`<span class="wk cur" aria-current="page" title="${t}">${w}${pl}</span>`:`<a class="wk" href="${ARCHIVE}${DATA.season}_wk${pad(w)}.html" title="${t}">${w}${pl}</a>`}).join("")+
  (location.hostname==="aktuell.nfl-tv-plan.workers.dev"?"":`<a class="wk now" href="${CURRENT}" title="Aktueller TV-Plan">Aktueller Plan ›</a>`);
 document.getElementById("timenote").textContent="🕒 "+DATA.notes_time;
 document.getElementById("tabs").innerHTML=Object.keys(CN).map(c=>`<button class="tab${c==="all"?" on":""}" data-f="${c}">${ICONS[c]||FLAGS[c]}${CN[c]}</button>`).join("");
 // Auf einen Blick: alle Gratis-Angebote ausserhalb der USA
 const slotOf={};DATA.slots.forEach(s=>slotOf[s.id]=s);
 let gl=[];if(!RESULTS)DATA.games.forEach(g=>{if(g.final)return;CC.forEach(c=>(g[c]||[]).forEach(e=>{if(e.free)gl.push({c,g,e,s:slotOf[g.slot]})}))});
 document.getElementById("glance").innerHTML=`<h2>Gratis auf einen Blick</h2><div class="gl">`+gl.map(x=>`<div class="gi" data-c="${x.c}" data-g="${gameId(x.g)}">${flag(x.c)}<div class="tm">${x.s.time}<small>${x.s.day}</small></div><div class="g"><b>${x.g.away} @ ${x.g.home}</b><div class="glrow">${logo(x.e.ch)}${(LOGO_CFG[x.e.ch]||{}).word?"":`<span>${esc(x.e.gl||x.e.txt.split(" · ")[0])}</span>`}</div>${x.e.where?`<span class="wh">${esc(x.e.short||"gratis bei DAZN · verifiziert: Frankreich")}</span>`:""}${x.e.src?`<span class="badge src" style="display:inline-block;margin-top:3px">${esc(x.e.src)}</span>`:""}</div></div>`).join("")+`</div>`;
 document.getElementById("slots").innerHTML=DATA.slots.map(s=>{const gs=DATA.games.filter(g=>g.slot===s.id);return `<section class="slot" data-slot="${s.id}"><div class="slothead"><span class="t">${s.time}<small>${s.tz||"MEZ"}</small></span><span class="l">${esc(s.label)}</span><span class="d">${esc(s.day)}</span><span class="et">${esc(s.et)}</span><span class="badge paid hide" data-played>bereits gespielt</span></div><div class="grid">${gs.map(card).join("")}</div></section>`}).join("");
 const box=(c,title,arr,extra)=>`<div class="ibox" data-c="${c}"><h3>${flag(c)}${title}</h3>${arr.map(e=>entryRow(c,e)).join("")}${extra?`<div class="com" style="margin-top:6px">${esc(extra)}</div>`:""}</div>`;
 if(RESULTS){document.getElementById("info").remove();document.getElementById("glance").innerHTML=""}
 else document.getElementById("info").innerHTML=`<h2 style="grid-column:1/-1">Weitere Infos je Land</h2>`+box("us","USA",DATA.us_general)+box("de","Deutschland",DATA.de_general)+box("uk","UK · Free-TV",DATA.uk_general,DATA.uk_none)+box("dazn","DAZN · Gratisspiel der Woche",DATA.dazn_general||[]);
 document.getElementById("byes").innerHTML="Spielfrei (Bye Week): "+DATA.byes.map(b=>LOGOS["team_"+b]?`<img src="${LOGOS["team_"+b]}" alt="${b}" title="${b}">`+b:b).join(" · ");
 document.getElementById("foot").innerHTML=`<b>Quellen</b><ol>${DATA.sources.map(s=>`<li>${esc(s.label)} – <a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.url)}</a></li>`).join("")}</ol><div>${esc(DATA.disclaimer)}  <span class="badge src">laut …</span> nennt die (Sekundär-)Quelle. Logos sind Marken der jeweiligen Inhaber.</div><div class="stand">Stand: ${esc(STAND)}</div>`;
 document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>filter(b.dataset.f));
 document.getElementById("donenote").onclick=e=>{if(e.target.closest("button"))filter("all")};
 document.getElementById("restog").onclick=toggleRes;
}
// Filter: Länder-Tabs zeigen nur anstehende/laufende Spiele mit Senderinfos; beendete Spiele (kompakte Ergebnis-Karten) nur unter "Alle"
function filter(f){CUR_F=f;applyFilter();history.replaceState(null,"",f==="all"?location.pathname:"#"+f)}
function applyFilter(){const f=CUR_F;
 document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.f===f));
 document.querySelectorAll(".row[data-c]").forEach(r=>{const fb=r.dataset.fb==="1";r.classList.toggle("hide",f==="all"?fb:r.dataset.c!==f)});
 let nd=0;document.querySelectorAll(".card").forEach(c=>{const has=(c.dataset.has||"").split(" "),dn=c.classList.contains("done");let show=f==="all"||(!dn&&(f==="us"||has.includes(f)));if(dn&&f!=="all")nd++;c.classList.toggle("hide",!show)});
 document.querySelectorAll(".slot").forEach(s=>s.classList.toggle("hide",!s.querySelector(".card:not(.hide)")));
 document.querySelectorAll(".gi,.ibox").forEach(x=>{const c=x.dataset.g&&document.querySelector(`[data-gid="${x.dataset.g}"]`);x.classList.toggle("hide",!(f==="all"||x.dataset.c===f)||!!(c&&c.classList.contains("done")))});
 const g=document.getElementById("glance");g.classList.toggle("hide",!g.querySelector(".gi:not(.hide)"));
 const dn=document.getElementById("donenote");dn.classList.toggle("hide",!nd);
 if(nd)dn.innerHTML=`<span>✓ ${nd===1?"1 bereits beendetes Spiel ist":nd+" bereits beendete Spiele sind"} hier ausgeblendet – ohne Senderinfos, ${SHOW_RES?"mit Ergebnis und":"mit"} Highlights unter „Alle“.</span><button type="button">Alle zeigen</button>`;
}
render();
const h=location.hash.slice(1);filter(CN[h]?h:"all");
refreshCards();loadLive();
</script>
</body>
